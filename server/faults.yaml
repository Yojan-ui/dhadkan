# How a reading becomes a severity (server/diagnosis.py, tests/test_diagnosis.py).
severity:
  order: [watch, repair_soon, stop_now, replace]
  labels:
    watch: {en: "Watch", hi: "ध्यान दो", mr: "लक्ष ठेवा", hi_latn: "Dhyan do", gu: "ધ્યાન રાખો"}
    repair_soon: {en: "Repair soon", hi: "जल्दी रिपेयर", mr: "लवकर दुरुस्त करा", hi_latn: "Jaldi repair", gu: "જલ્દી રિપેર કરાવો"}
    stop_now: {en: "Consider stopping it", hi: "बंद करने का सोचिए", mr: "बंद करण्याचा विचार करा", hi_latn: "Band karne ka sochiye", gu: "બંધ કરવાનું વિચારો"}
    replace: {en: "Beyond repair (replace)", hi: "बदलना पड़ेगा", mr: "दुरुस्तीपलीकडे, बदला", hi_latn: "Badalna padega", gu: "રિપેરથી બહાર, બદલો"}
  rules:
    stop_now_within_days: 2      # the low end of the days-to-fault range is this close, or it already sounds faulty
    repair_soon_within_days: 14  # alarm, registry match, or the low end of the range within this
    replace_after_days_at_fault: 3  # sounding like the recorded fault for this long: the part has likely run to destruction
  note: "Thresholds are our choice, not a standard. The agent never stops a machine; the owner decides."

faults:
  bearing_wear:
    name: {en: "motor bearing wear", hi: "मोटर बेयरिंग घिसना", mr: "मोटर बेअरिंग झिजणे", hi_latn: "motor bearing ghisna", gu: "મોટર બેરિંગ ઘસાવું"}
    what: {en: "The ball bearing in the motor is wearing out.", hi: "मोटर का बेयरिंग घिस रहा है।", mr: "मोटरचे बेअरिंग झिजत आहे.", hi_latn: "Motor ka bearing ghis raha hai.", gu: "મોટરનું બેરિંગ ઘસાઈ રહ્યું છે."}
    repairable:
      answer: true
      why: "A bearing is a wear part. A new one restores the motor if the shaft and housing are not damaged."
      not_when: "the shaft or the bearing housing is scored or worn oval"
    fix:
      part: {en: "ball bearing 6205 (same number as the old one)", hi: "बेयरिंग 6205 (पुराने जैसा नंबर)", mr: "बेअरिंग 6205 (जुन्यासारखा नंबर)", hi_latn: "bearing 6205 (purane jaisa number)", gu: "બેરિંગ 6205 (જૂના જેવો નંબર)"}
      price_inr: [65, 180]
      price_unit: "per bearing; a motor usually has two"
      price_source: moglix_6205
      labour_hours: [1, 2]
      labour_source: null
      technician: {en: "motor mechanic (fitter)", hi: "मोटर मिस्त्री", mr: "मोटर मिस्त्री", hi_latn: "motor mistri", gu: "મોટર મિસ્ત્રી"}
      tools: [bearing puller, spanner set, grease gun, rubber mallet]  # typical, for the mechanic's message
    misuse:
      - {en: "no greasing, or the wrong grease", source: skf_causes}
      - {en: "dust or water getting in", source: skf_causes}
      - {en: "hammering the bearing on during fitting", source: skf_causes}
      - {en: "overloading the machine", source: fluidlife_skf}
      - {en: "belt or coupling out of line", source: fluidlife_skf}
    warranty:
      period: null
      note: "No published figure found for a fitted bearing. Ask the dealer what they give."
      voided_by: [{en: "running without grease", source: null}, {en: "overload or misalignment after fitting", source: null}]
    if_ignored:
      what: {en: "the motor can burn", hi: "मोटर जल सकती है", mr: "मोटर जळू शकते", hi_latn: "motor jal sakti hai", gu: "મોટર બળી શકે છે"}
      cost_basis: rewind
  misalignment:
    name: {en: "shaft misalignment", hi: "शाफ़्ट का टेढ़ापन", mr: "शाफ्ट चुकीच्या रेषेत", hi_latn: "shaft ka tedhapan", gu: "શાફ્ટ વાંકો/લાઇનમાં નથી"}
    what: {en: "The motor and machine shafts are out of line.", hi: "मोटर और मशीन का शाफ़्ट एक सीध में नहीं है।", mr: "मोटर आणि मशीनचा शाफ्ट एका रेषेत नाही.", hi_latn: "Motor aur machine ka shaft ek seedh mein nahi hai.", gu: "મોટર અને મશીનનો શાફ્ટ એક લાઇનમાં નથી."}
