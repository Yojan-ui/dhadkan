[project]
name = "dhadkan"
version = "0.2.0"
description = "Machine sound watch for small factories: edge anomaly model, fault registry, quiet agent."
requires-python = ">=3.12"

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "data/raw"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN", "RUF", "C4", "PIE", "RET"]
ignore = [
  "E501",    # black owns line length
  "ANN401",  # Any is fine for JSON-shaped values
  "RUF001", "RUF002", "RUF003",  # Devanagari and typographic characters are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["edge", "server", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
